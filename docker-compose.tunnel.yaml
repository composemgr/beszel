name: beszel
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: henrygd/beszel:latest
    container_name: beszel-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: beszel-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      APP_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/beszel:/beszel_data'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://beszel-app:8090'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - beszel
      - cloudflare

networks:
  beszel:
    name: beszel
    external: false
  cloudflare:
    external: true
